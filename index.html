<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<script>window.__rpErrors=[];addEventListener('error',function(e){window.__rpErrors.push(String(e.message||e.type))});addEventListener('unhandledrejection',function(e){window.__rpErrors.push('rejection: '+String(e.reason))});</script>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#546e7a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<meta name="rp-deploy" content="pages">
<script>window.__RP_DEVICE_IP__="";</script>
<title>拾源</title>
<style>
/* 拾源 · 移动版 —— 界面沿用资料库《拾源-移动版》v0.2 原型 */
:root{
  --title:#546e7a; --bg:#1b1b1b; --card:#242424; --line:#3a3a3a;
  --label:#ff8a3d; --txt:#e8e8e8; --sub:#9a9a9a; --accent:#4fc3f7;
  --ok:#66bb6a; --warn:#ffb74d; --hit:#5d4037;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none !important}
html,body{margin:0;height:100%;background:#0d0d0d;font:14px/1.55 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--txt)}
body{display:flex;justify-content:center;align-items:stretch}
.phone{width:min(430px,100vw);min-width:0;max-width:100vw;flex:0 0 auto;height:100dvh;display:flex;flex-direction:column;background:var(--bg);position:relative;overflow:hidden;box-shadow:0 0 40px #000}
.phone > *{min-width:0;max-width:100%}
/* 状态栏 */
.status{height:26px;background:var(--title);display:flex;align-items:center;justify-content:space-between;padding:0 12px;font-size:11px;color:#eceff1;flex:none}
/* 地址栏 */
.addr{flex:none;display:flex;align-items:center;gap:6px;padding:7px 8px;background:var(--title)}
.addr input{flex:1;min-width:0;display:block;background:#eceff1;border:0;border-radius:20px;padding:8px 12px;font-size:13px;color:#263238;outline:none}
.addr button{flex:none;border:0;background:rgba(255,255,255,.55);color:#37474f;border-radius:14px;height:28px;min-width:30px;padding:0 9px;font-size:12px;cursor:pointer}
.addr button#go{border-radius:50%;width:28px;padding:0;font-size:14px}
.addr button:active{background:rgba(255,255,255,.35)}
.addr button#live.on{background:#ff8a3d;color:#fff;font-weight:600}
/* 拾取横幅 */
.deploybar{
  flex:0 0 auto;background:#3e2723;border-left:4px solid var(--label);
  padding:8px 10px;font-size:12px;display:flex;align-items:center;gap:8px;
  flex-wrap:wrap;line-height:1.5;
}
.deploybar b{color:#ff8a3d;flex:none}
.deploybar span{color:#ffccbc;font-size:11.5px;flex:1;min-width:0}
.banner{flex:none;background:#37474f;border-left:4px solid var(--warn);padding:8px 10px;font-size:12px;display:flex;align-items:center;gap:8px}
.banner b{color:var(--warn)}
.banner button{margin-left:auto;border:0;background:#546e7a;color:#fff;border-radius:5px;padding:4px 9px;font-size:11px}
/* 主视区 */
.viewport{flex:1;min-height:0;position:relative;background:#fff}
.layer{position:absolute;inset:0;overflow:auto}
#stage{padding:0;overflow:hidden}
#frame{display:block;width:100%;height:100%;border:0;background:#fff}
.frameloading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.9);color:#37474f;font-size:13px;z-index:5}
/* 直出模式提示条（盖在 iframe 顶部；iframe 跨域，这一条只能由父页面画） */
.livebar{position:absolute;left:0;right:0;top:0;z-index:6;display:flex;align-items:center;gap:6px;padding:6px 8px;background:rgba(38,50,56,.94);color:#eceff1;font-size:11px;line-height:1.45;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.livebar .lb-t{flex:1;min-width:0}
.livebar button{flex:none;border:0;background:#ff8a3d;color:#fff;border-radius:11px;padding:4px 9px;font-size:11px;cursor:pointer}
.livebar button#liveBack{background:#546e7a}
/* 拾取高亮（注入到 iframe 内的文档） */
.rp-hv{outline:2px solid #ff5252 !important;outline-offset:1px;background:rgba(255,82,82,.10) !important;cursor:crosshair !important}
.rp-picked{outline:3px solid var(--accent) !important;background:rgba(79,195,247,.14) !important}
.rp-hit{outline:2px dashed var(--warn) !important;background:rgba(255,183,77,.18) !important}
.rp-ins-hl{outline:3px solid var(--label) !important;outline-offset:1px;background:rgba(255,138,61,.18) !important}
/* 面板：仿「编辑订阅源」 */
.panel{background:var(--bg);display:flex;flex-direction:column}
.ptitle{flex:none;background:var(--title);padding:11px 40px 11px 14px;font-size:16px;display:flex;align-items:center;gap:10px;position:relative}
.ptitle .back{cursor:pointer;font-size:14px;color:#fff;white-space:nowrap}
.ptitle .sp{flex:1}
.ptitle .ic{font-size:14px;color:#fff;cursor:pointer;padding:1px 6px;border:1px solid #78909c;border-radius:5px;margin-left:5px}
.checks{flex:none;display:flex;gap:16px;padding:10px 14px;font-size:12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.checks label{display:flex;align-items:center;gap:5px;cursor:pointer}
.checks input{accent-color:#ef6c00;width:15px;height:15px}
.subtabs{flex:none;display:flex;border-bottom:1px solid var(--line);overflow-x:auto}
.subtabs div{flex:1;min-width:76px;text-align:center;padding:11px 4px;font-size:13px;color:var(--sub);cursor:pointer;white-space:nowrap}
.subtabs div.on{color:#fff;border-bottom:2px solid #ff7043}
.fields{flex:1;overflow:auto;padding:4px 14px 10px}
.frow{padding:9px 2px 11px;border-bottom:1px solid var(--line);cursor:pointer;position:relative}
.frow:active{background:#2c2c2c}
.frow.flash{animation:fl 1.2s ease}
@keyframes fl{0%,40%{background:#4e342e}100%{background:transparent}}
.flabel{color:var(--label);font-size:13px}
.flabel .key{color:#b0764a;font-size:11px}
.fval{margin-top:4px;font:12px/1.45 ui-monospace,Menlo,Consolas,monospace;color:var(--txt);word-break:break-all;white-space:pre-wrap}
.fval.empty{color:#6d6d6d;font-family:inherit}
.frow .tick{position:absolute;right:8px;top:9px;color:var(--ok);font-size:14px}
.frow .edit{position:absolute;right:8px;bottom:8px;color:var(--accent);font-size:13px}
.pfoot{flex:none;display:flex;gap:7px;padding:9px 10px;border-top:1px solid var(--line);background:#202020}
.pfoot button{flex:1;border:1px solid #555;background:#2f2f2f;color:#eee;border-radius:6px;padding:8px 4px;font-size:12px;cursor:pointer}
.pfoot button.pri{background:#ef6c00;border-color:#ef6c00;color:#fff}
/* 交互设置页 */
.inter{padding:14px;background:var(--bg)}
.inter h3{font-size:13px;color:var(--label);margin:16px 0 8px;font-weight:500}
.srow{display:flex;align-items:center;gap:10px;padding:12px 2px;border-bottom:1px solid var(--line)}
.srow .t{flex:1}.srow .t b{font-size:14px;font-weight:500}.srow .t small{display:block;color:var(--sub);font-size:11px;margin-top:2px}
.sw{width:44px;height:24px;border-radius:14px;background:#555;position:relative;transition:.2s;flex:none;cursor:pointer}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:#ef6c00}.sw.on::after{left:23px}
.srow select{background:#333;color:#eee;border:1px solid #555;border-radius:5px;padding:5px 6px;font-size:12px;max-width:150px}
.minirow{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
.minirow button,.minirow select{border:1px solid #546e7a;background:#37474f;color:#eceff1;border-radius:6px;padding:6px 9px;font-size:12px;cursor:pointer}
.tipbox{background:#2a2a2a;border-left:3px solid var(--accent);padding:10px;font-size:12px;color:#bbb;margin-top:14px;line-height:1.7}
.tipbox.err{border-left-color:#ef5350;color:#ffcdd2}
/* 底部导航 */
.tabs{flex:none;position:relative;z-index:40;display:flex;background:#202020;border-top:1px solid #333;padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;border:0;background:none;color:var(--sub);padding:9px 0 8px;font-size:11px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
.tabs button .ico{font-size:19px;line-height:1}
.tabs button.on{color:#ff8a3d}
.tabs button.on.canBack::after{content:'再点返回';position:absolute;top:3px;right:5px;font-size:8px;color:#ff8a3d;opacity:.85;pointer-events:none}
.tabs button.navbtn{flex:0 0 44px;margin:6px 5px;padding:4px 0;gap:0;justify-content:center;font-size:22px;color:#5b6165;background:transparent;border-radius:8px;transition:.18s;opacity:.5}
.tabs button.navbtn .ico{font-size:22px;line-height:1;font-family:ui-monospace,Menlo,Consolas,monospace}
.tabs button.navbtn.avail{color:#fff;background:#37474f;opacity:1;box-shadow:inset 0 0 0 1px #546e7a}
/* 元素审核页（底部弹出，上半网页仍可见） */
.inspector{position:absolute;left:0;right:0;bottom:0;height:66%;z-index:35;background:#1e1e1e;border-top:2px solid var(--label);display:flex;flex-direction:column;box-shadow:0 -8px 24px rgba(0,0,0,.6)}
.phone.ins-full .status,.phone.ins-full .addr,.phone.ins-full .banner{display:none}
.phone.ins-full .inspector{top:0;height:100%;border-top-width:0;box-shadow:none}
.ins-bar{flex:none;display:flex;align-items:center;gap:5px;padding:7px 8px;background:#263238;border-bottom:1px solid #37474f;overflow-x:auto}
.ins-bar .ttl{font-size:12px;color:#fff;white-space:nowrap}
.ins-bar select{background:#37474f;color:#fff;border:1px solid #546e7a;border-radius:5px;padding:5px 5px;font-size:11px;flex:none}
.ins-bar button{flex:none;border:1px solid #546e7a;background:#37474f;color:#eceff1;border-radius:5px;min-width:30px;padding:5px 6px;font-size:12px;cursor:pointer}
.ins-bar button.on{background:var(--label);border-color:var(--label);color:#1b1b1b;font-weight:600}
.ins-bar .sp{flex:1}
.ins-scope{flex:none;padding:6px 10px;background:#242424;border-bottom:1px solid var(--line);font:11px/1.5 ui-monospace,Menlo,Consolas,monospace;color:#cfd8dc;word-break:break-all}
.ins-scope b{color:var(--label)}
.ins-html{flex:none;max-height:64px;overflow:auto;padding:6px 10px;background:#111;border-bottom:1px solid var(--line);font:10px/1.5 ui-monospace,Menlo,Consolas,monospace;color:#90a4ae;white-space:pre-wrap;word-break:break-all}
.ins-tree{flex:1;overflow:auto;padding:6px 0 10px;font:11px/1.75 ui-monospace,Menlo,Consolas,monospace;position:relative}
.irow{display:flex;align-items:flex-start;gap:5px;padding:2px 10px;white-space:normal;cursor:pointer;border-left:3px solid transparent;flex-wrap:wrap}
.irow .sig{flex:1;min-width:0;word-break:break-all}
.irow:hover{background:#2b2b2b}
.irow.cur{background:#3a2a1e;border-left-color:var(--label)}
.irow.fold{color:#78909c;cursor:default}
.irow .caret{color:#78909c;width:12px;flex:none;text-align:center}
.irow .tg{color:var(--accent)}
.irow .at{color:#a5d6a7}
.irow .av{color:#ffcc80}
.irow .cnt{color:var(--label);font-size:10px;margin-left:3px}
.irow .note{color:#78909c;font-size:10px;margin-left:4px}
.ins-opts{flex:none;display:flex;gap:9px;align-items:center;padding:7px 10px;background:#202020;border-top:1px solid var(--line);font-size:11px;flex-wrap:wrap}
.ins-opts select{background:#333;color:#eee;border:1px solid #555;border-radius:5px;padding:3px 5px;font-size:11px}
.ins-opts .hint{color:#78909c}
.ins-prev{flex:none;padding:6px 10px;background:#151515;border-top:1px solid var(--line)}
.ins-prev .lb{font-size:10px;color:var(--sub)}
.ins-prev code{display:block;font:11px/1.5 ui-monospace,Menlo,Consolas,monospace;color:#80cbc4;word-break:break-all;max-height:56px;overflow:auto;white-space:pre-wrap}
.ins-probe{font:10px/1.5 ui-monospace,Menlo,Consolas,monospace;color:#a5d6a7;padding:3px 10px 5px;background:#151515;white-space:pre-wrap;word-break:break-all}
.ins-probe b{color:#ffcc80;font-weight:600}
.ins-probe i{color:#90a4ae;font-style:normal}
.ins-probe.hint{color:#78909c;background:#181818}
.ins-probe.err{color:#ef9a9a;background:#241818;border-top:1px solid #5d2b2b}
.ins-probe.multi{color:var(--warn);background:#2a2318;border-top:1px solid #5d4b2b}
.ins-foot{flex:none;display:flex;gap:8px;padding:9px 10px;background:#202020;border-top:1px solid var(--line)}
.ins-foot button{flex:1;border:1px solid #555;background:#2f2f2f;color:#eee;border-radius:6px;padding:9px 4px;font-size:13px;cursor:pointer}
.ins-foot button.pri{background:#ef6c00;border-color:#ef6c00;color:#fff;font-weight:600}
/* 首页 */
.home{display:flex;flex-direction:column;justify-content:center;gap:13px;padding:22px 18px;background:var(--bg)}
.home .hfield input{width:100%;padding:15px 14px;font-size:14px;color:#eceff1;background:#263238;border:1px solid #546e7a;border-radius:10px;outline:none}
.home .hfield input:focus{border-color:var(--label)}
.home .hbtn{width:100%;padding:15px 12px;font-size:15px;color:#eceff1;background:#2f3b42;border:1px solid #546e7a;border-radius:10px;cursor:pointer;text-align:center}
.home .hbtn:active{background:#3e4c54}
.home .hbtn.pri{background:#ef6c00;border-color:#ef6c00;color:#fff;font-weight:600}
.home .hbtn.ghost{background:transparent;border-style:dashed;color:var(--sub)}
.home .hmeta{font-size:11px;color:var(--sub);text-align:center;line-height:1.6;word-break:break-all}
.phone.home-mode .addr,.phone.home-mode .banner{display:none}
/* toast / modal */
.toast{position:absolute;left:50%;bottom:78px;transform:translateX(-50%);background:#323232;color:#fff;padding:9px 14px;border-radius:20px;font-size:12px;z-index:30;opacity:0;transition:.25s;pointer-events:none;max-width:88%;text-align:center}
.toast.show{opacity:1}
.mask{position:absolute;inset:0;background:rgba(0,0,0,.6);z-index:40;display:flex;align-items:flex-end}
.sheet{width:100%;background:#242424;border-radius:14px 14px 0 0;padding:14px 14px 18px;max-height:86%;overflow:auto}
.sheet h4{margin:0 0 10px;font-size:14px;color:var(--label)}
.sheet .opt{padding:11px 8px;border-bottom:1px solid var(--line);font-size:13px;cursor:pointer;display:flex;gap:9px;align-items:center}
.sheet .opt span{color:var(--sub);font-size:11px}
.sheet .opt:active{background:#333}
.sheet .vinfo{font-size:11px;line-height:1.6;color:#bbb;padding:8px 0;white-space:pre-wrap;word-break:break-all}
.sheet .vinfo.e{color:#ef9a9a}.sheet .vinfo.w{color:#ffcc80}
textarea.json{width:100%;height:180px;background:#1a1a1a;color:#cfd8dc;border:1px solid #444;border-radius:7px;padding:9px;font:11px/1.5 ui-monospace,Menlo,Consolas,monospace;white-space:pre;overflow:auto}
/* 交互页里的行内输入框（App 主机 / 端口） */
.srow .sinput{flex:none;width:126px;background:#263238;border:1px solid #546e7a;border-radius:6px;color:#eceff1;padding:7px 8px;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;outline:none;text-align:center}
.srow .sinput.num{width:70px}
.srow .sinput:focus{border-color:var(--label);background:#2c3a41}
/* 调试页 */
.dbg{background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
.dbg .dbody{flex:1;min-height:0;display:flex;flex-direction:column;padding:0 14px}
.dbg .dstat{flex:none;margin:12px 0 4px;background:#202020;border-left:3px solid #546e7a;padding:9px 10px;font:11px/1.7 ui-monospace,Menlo,Consolas,monospace;color:#cfd8dc;word-break:break-all}
.dbg .dstat b{color:var(--label)}
.dbg .dstat .st-ok{color:#66bb6a}.dbg .dstat .st-warn{color:#ffb74d}.dbg .dstat .st-err{color:#ef5350}
.dbg .drow{flex:none;display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.dbg .drow .lb{flex:none;min-width:52px;color:var(--label);font-size:12px}
.dbg .drow input{flex:1;min-width:0;background:#263238;border:1px solid #546e7a;border-radius:6px;color:#eceff1;padding:7px 9px;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;outline:none}
.dbg .drow input:focus{border-color:var(--label)}
.dbg .seg{display:flex;gap:6px}
.dbg .seg button{border:1px solid #546e7a;background:#2a3238;color:#cfd8dc;border-radius:6px;padding:6px 10px;font-size:12px;cursor:pointer}
.dbg .seg button.on{background:#ef6c00;border-color:#ef6c00;color:#fff;font-weight:600}
.dbg .dbgbar{flex:none;display:flex;gap:7px;padding:9px 0;flex-wrap:wrap}
.dbg .dbgbar button{flex:1;min-width:88px;border:1px solid #555;background:#2f2f2f;color:#eee;border-radius:6px;padding:9px 6px;font-size:12px;cursor:pointer}
.dbg .dbgbar button.pri{background:#ef6c00;border-color:#ef6c00;color:#fff;font-weight:600}
.dbg .dbgbar button:disabled{opacity:.45}
.dbglog{flex:1;min-height:180px;overflow:auto;margin:4px 0 14px;background:#141414;border:1px solid #333;border-radius:8px;padding:8px 10px;font:11px/1.65 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-all}
.dbglog .l{display:block}
.dbglog .l .tm{color:#546e7a;margin-right:5px}
.dbglog .l.info{color:#90caf9}
.dbglog .l.ok{color:#a5d6a7}
.dbglog .l.warn{color:#ffcc80}
.dbglog .l.err{color:#ef9a9a}
.dbglog .l.log{color:#cfd8dc}
.dbg .hint{flex:none;font-size:11px;color:var(--sub);padding:8px 0 12px;line-height:1.6}
/* 源管理（嵌在调试页内：读 / 改 / 删 / 导入 App 内已有的书源、订阅源） */
.dbgsubtabs{flex:none;margin:0;padding:0 6px;border-bottom:1px solid var(--line);background:#1f1f1f}
.dbgsubtabs div{flex:1;text-align:center;padding:10px 4px;font-size:13px;color:var(--sub);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.dbgsubtabs div.on{color:#fff;border-bottom-color:#ff7043}
.srclist{flex:1;min-height:160px;overflow:auto;margin:6px 0 14px;background:#141414;border:1px solid #333;border-radius:8px;padding:4px 0}
.src-item{padding:10px 11px;border-bottom:1px solid #262626;cursor:pointer;display:flex;align-items:flex-start;gap:8px}
.src-item:last-child{border-bottom:none}
.src-item:active{background:#222}
.src-item .src-main{flex:1;min-width:0}
.src-item .src-imp{flex:none;align-self:center;border:1px solid #4a7a4a;background:#1f2f1f;color:#c8f0c8;border-radius:6px;padding:5px 9px;font-size:11px;white-space:nowrap;cursor:pointer}
.src-item .src-imp:active{background:#2a3f2a}
.src-name{font-size:13px;color:#eee;display:flex;align-items:center;gap:7px}
.src-name .src-grp{font-size:10px;color:#fff;background:#37474f;border-radius:10px;padding:1px 8px;white-space:nowrap}
.src-url{margin-top:3px;font:11px/1.5 ui-monospace,Menlo,Consolas,monospace;color:#7fa87f;word-break:break-all}
/* 源编辑弹层里的按钮 */
.sheet.kedit .edbtn{flex:none;display:flex;gap:7px;margin-top:8px;flex-wrap:wrap}
.sheet.kedit .edbtn button{flex:1 1 30%;min-width:72px;border:1px solid #555;background:#2f2f2f;color:#eee;border-radius:7px;padding:9px 4px;font-size:12px;cursor:pointer}
.sheet.kedit .edbtn #mImport{flex-basis:100%;background:#2e7d32;border-color:#2e7d32;color:#fff;font-weight:600}
.sheet.kedit .edbtn #mSave{background:#ef6c00;border-color:#ef6c00;color:#fff;font-weight:600}
.sheet.kedit .edbtn #mDelete{border-color:#7a3524;background:#2a2013;color:#ffb59e}
.sheet.kedit .edbtn #mCopy{border-color:#4a7a4a;background:#1f2f1f;color:#c8f0c8}
.sheet.kedit .edbtn button:active{transform:scale(.97)}
#selftest-out{position:absolute;left:-9999px}

/* ---------------- WEB_VIEW：通用规则生成器 ---------------- */
.kitbox{margin:10px 0 4px;padding:10px 10px 8px;background:#202020;border:1px solid var(--line);border-radius:8px}
.kitbox .krow{display:flex;align-items:center;gap:8px;padding:7px 0;flex-wrap:wrap}
.kitbox .klb{color:var(--label);font-size:13px;min-width:74px;flex:none}
.kitbox .ksub{color:var(--sub);font-size:11px}
.kitbox .kchips{display:flex;gap:6px;flex-wrap:wrap}

.sheet.kedit .edbtn{display:flex;gap:8px}

.kitbox .kpick{padding:9px 0;border-bottom:1px solid #2b2b2b;cursor:pointer}

.kitbox .kpick .kar{color:#888;font-size:15px;flex:none}

  </div>

  <div class="banner" hidden id="banner">正在为 <b id="bannerField">—</b> 拾取 · <span id="bannerHint">请点击网页上的元素</span><button id="cancelPick">取消</button></div>

  <div class="viewport">
    <!-- 真实网页快照：沙箱 iframe，站点脚本已在服务端剥离，只保留点击跳转的桥 -->
    <div class="layer" id="stage">
      <iframe id="frame" sandbox="allow-same-origin allow-scripts allow-forms allow-popups" title="目标网页快照"></iframe>
      <div class="frameloading" id="frameLoading" hidden>正在抓取并渲染…</div>

      <div class="livebar" id="liveBar" hidden>
        <span class="lb-t">原样模式</span>
        <button id="liveBack">切回快照</button>
        <button id="liveOut" hidden>浏览器打开</button>
      </div>
    </div>

    <!-- 首页：严格 1 个编辑框 + 3 个按钮 -->
    <div class="layer home" hidden id="home"></div>

    <!-- 交互设置 -->
    <div class="layer inter" hidden id="inter"></div>

    <!-- 阅读 App 调试（内含「调试 / 读取源」两个子页） -->
    <div class="layer dbg" hidden id="debug"></div>

    <!-- 书源 / 订阅源字段页 -->
    <div class="layer panel" hidden id="panel">
      <div class="ptitle">
        <span class="back" id="pBack" title="返回网页">‹ 网页</span>
        <span id="pTitle">编辑订阅源</span>
        <span class="sp"></span>
        <span class="ic" id="pSwitch" title="切换书源 / 订阅源">⇄</span>
        <span class="ic" id="pHome" title="返回首页">⌂</span>
        <span class="ic" id="pSave" title="预览 JSON">▣</span>
      </div>
      <div class="checks">
        <label><input checked id="cEnabled" type="checkbox"> 启用</label>
        <label><input id="cSingle" type="checkbox"> 单 URL</label>
        <label><input checked id="cCookie" type="checkbox"> Cookie.Jar</label>
      </div>
      <div class="subtabs" id="subtabs"></div>
      <div class="fields" id="fields"></div>
      <div class="pfoot">
        <button id="btnJson">预览 JSON</button>
        <button id="btnCopy">复制</button>
        <button class="pri" id="btnExport">导出</button>
      </div>
    </div>

    <div class="toast" id="toast"></div>
    <div id="maskHost"></div>
    <!-- 元素审核页：点元素后先选范围，确定才提取 -->
    <div class="inspector" hidden id="inspector"></div>
  </div>

  <nav class="tabs" id="tabs">
    <button class="navbtn" data-nav="prev" id="navPrev" title="上一个网页"><span class="ico">&lt;</span></button>
    <button data-tab="inter"><span class="ico">⇄</span>设置</button>
    <button data-tab="edit"><span class="ico">✎</span>编辑</button>
    <button data-tab="debug"><span class="ico">◎</span>调试</button>
    <button class="navbtn" data-nav="next" id="navNext" title="下一个网页"><span class="ico">&gt;</span></button>
  </nav>
</div>

      const r1 = buildContentRule(Object.assign({}, S.kit, { pages: 6, textFirstPageOnly: false }));

        "\u751F\u6210\u5668\uFF1A6 \u9875\u4E0A\u9650 + \u6587\u5B57\u968F\u9875\u8FFD\u52A0",

        "\u52FE\u9009\u53D8\u5316\u4F1A\u5B9E\u65F6\u91CD\u751F\u6210\uFF1A\u53BB\u6389\u56FE\u7247\u540E\u6CA1\u6709\u56FE\u96C6\u6A21\u5757",

      ruleArticles: "@css:ul > li",
      ruleTitle: "h2@text",
      ruleLink: "a@href"
    };

    try {
      parsed = JSON.parse(json);
    } catch {
    }
    ok("\u5BFC\u51FA JSON \u53EF\u89E3\u6790", !!parsed && Array.isArray(parsed));
    ok("\u5BFC\u51FA\u65E0\u7AD9\u70B9\u786C\u7F16\u7801", !/paomianz|泡面站/.test(json));
    const v = await validateJSON(json);
    ok("validate_source.py 0 \u9519\u8BEF", v.ok === true, JSON.stringify(v.counts || {}));

    ok(
      "\u5BFC\u822A\uFF1A\u300C\u8C03\u8BD5\u300D\u6309\u94AE\u5728\u300C\u7F16\u8F91\u300D\u53F3\u4FA7",
      tabList.indexOf("debug") === tabList.indexOf("edit") + 1,
      tabList.join(" > ")
    );

    const hostEl = $("lgHost"), portEl = $("lgPort");

      "\u4EA4\u4E92\u9875\uFF1AApp \u4E3B\u673A / \u7AEF\u53E3\u8F93\u5165\u6846\u5B58\u5728\u4E14\u9ED8\u8BA4 192.168.65.60:1122",
      !!hostEl && !!portEl && LG_DEFAULTS.host === "192.168.65.60" && LG_DEFAULTS.port === "1122" && hostEl.value === S.lg.host && portEl.value === S.lg.port,
      `${hostEl ? hostEl.value : "\u65E0"}:${portEl ? portEl.value : "\u65E0"}`
    );
    showView("debug");
    ok(
      "\u8C03\u8BD5\u9875\uFF1A\u663E\u793A\u76EE\u6807\u5730\u5740\u4E0E\u300C\u5F00\u59CB\u8C03\u8BD5\u300D",
      !!$("dStart") && !!$("dbgStat") && $("dbgStat").textContent.includes(`${S.lg.host}:${S.lg.port}`),
      $("dbgStat") ? $("dbgStat").textContent.slice(0, 60) : "\u65E0"
    );
    ok(
      "\u8C03\u8BD5\u9875\uFF1A\u8FDE\u63A5\u6D4B\u8BD5 / \u63A8\u9001\u6E90 / \u505C\u6B62 \u4E09\u4E2A\u6309\u94AE\u90FD\u5728",
      !!$("dProbe") && !!$("dPush") && !!$("dStop")
    );
    {
      const keepLines = S.dbg.lines.length, keepAll = S.dbg.allText, keepWarn = S.dbg.diagWarned;

      S.dbg.diagWarned = false;
      dbgDiagnose();
      const got = S.dbg.lines.slice(keepLines).map((x) => x.m).join(" ");
      ok(
        "\u8C03\u8BD5\u8BCA\u65AD\uFF1A\u5185\u5BB9\u9875\u662F\u6E90\u9996\u9875 + \u6CA1\u6709\u53D6\u5230\u5185\u5BB9 \u2192 \u63D0\u793A\u8C03\u8BD5\u901A\u9053\u5047\u8C61",
        /源首页/.test(got) && /不是规则坏了/.test(got),
        got.slice(0, 90)
      );
      S.dbg.lines.length = keepLines;
      S.dbg.allText = keepAll;
      S.dbg.diagWarned = keepWarn;
    }
    showView("web");
    ok(
      "\u89C4\u8303\u8868\u8986\u76D6\u8BA2\u9605\u6E90 / \u4E66\u6E90\u5173\u952E\u5B57\u6BB5",
      [
        "ruleArticles",
        "ruleNextPage",
        "ruleLink",
        "ruleImage",
        "ruleSearch.bookList",
        "ruleToc.chapterList"
      ].every((k) => !!FIELD_SPEC[k])
    );

      sourceName: "\u517C\u5BB9\u6E90",

      ruleNextArticles: "@css:a.next@href"
    };

    ok(
      "\u5BFC\u51FA\uFF1A\u65E7\u952E\u53EA\u5728\u5BFC\u5165\u4FA7\u517C\u5BB9\uFF0C\u5BFC\u51FA\u53EA\u5199 ruleNextPage\uFF08\u6821\u9A8C\u5668\u62D2\u7EDD ruleNextArticles\uFF09",
      /"ruleNextPage"/.test(compat) && !/"ruleNextArticles"/.test(compat)
    );
    const cv = await validateJSON(compat);
    ok("\u5BFC\u51FA\uFF1A\u542B\u4E0B\u4E00\u9875\u89C4\u5219\u65F6\u6821\u9A8C 0 ERROR", cv.ok === true, JSON.stringify(cv.counts || {}));
    const result = { pass, fail, lines };
    const out = $("selftest-out");
    out.textContent = "=== \u62FE\u6E90 \u79FB\u52A8\u7248\u5185\u7F6E\u81EA\u68C0\uFF08\u771F\u5B9E DOM\uFF09===\n" + lines.join("\n") + `
\u5408\u8BA1 ${pass} PASS / ${fail} FAIL
SELFTEST_RESULT:${JSON.stringify(result)}`;
    return result;
  }
  async function boot() {
    renderHome();
    showView("home");

      const ok = await probeBackend();
      if (!ok) {
        showDeployBanner();

        if (hasProxy) {
          // 已配置云端抓取代理 → 保持「快照」模式，走代理抓取
          try {
            if (localStorage.getItem(PV_KEY) === "live") localStorage.setItem(PV_KEY, "snap");
          } catch (e) { }
          S.preview = "snap";
          renderLiveBar();
          setNet("Pages \xB7 云端代理");
        } else {
          try {
            if (localStorage.getItem(PV_KEY) !== "live") localStorage.setItem(PV_KEY, "live");
          } catch (e) { }
          S.preview = "live";
          renderLiveBar();
          setNet("离线模式 \xB7 Pages");
        }
      }
    }
    await refreshProjects();
    const params = new URLSearchParams(location.search);
    if (params.has("selftest")) {
      try {
        await openFixture("tags.html", { keepView: true });
      } catch {
      }
      await runSelftest();
    } else if (params.has("home")) {
      showView("home");
    } else if (params.has("web")) {
      loadURL("https://example.com/");
    }
  }
  boot();
})();
