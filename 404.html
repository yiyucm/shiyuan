<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>拾源 · 页面不存在</title>
<style>
:root{--title:#546e7a;--bg:#1b1b1b;--line:#3a3a3a;--label:#ff8a3d;--txt:#e8e8e8;--sub:#9a9a9a}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--bg);color:var(--txt);
  font:15px/1.6 -apple-system,"PingFang SC","Noto Sans CJK SC",system-ui,sans-serif;
  display:flex;align-items:center;justify-content:center;padding:24px;
}
.box{max-width:420px;text-align:center}
h1{font-size:22px;margin:0 0 10px;color:var(--label)}
p{color:var(--sub);margin:0 0 22px;font-size:13.5px}
a{
  display:inline-block;background:var(--label);color:#2a1405;
  text-decoration:none;padding:12px 28px;border-radius:10px;font-weight:600;
}
</style>
</head>
<body>
<div class="box">
  <h1>拾源</h1>
  <p>这个页面不存在。<br>回到首页开始拾取规则。</p>
  <a href="./">回到首页</a>
</div>
</body>
</html>
